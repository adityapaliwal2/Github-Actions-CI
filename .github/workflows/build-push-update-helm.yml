name: Build Image & Update Helm Values

on:
  push:
    branches:
      - "**"

jobs:
  build-push-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect trigger condition
        id: trigger
        run: |
          echo "run_ci=false" >> $GITHUB_OUTPUT

          # Check feat/* branch
          if [[ "${GITHUB_REF}" == refs/heads/feat/* ]]; then
            echo "run_ci=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check Dockerfile change
          if git diff --name-only HEAD^ HEAD | grep -q '^Dockerfile$'; then
            echo "run_ci=true" >> $GITHUB_OUTPUT
            exit 0
          fi

      - name: Skip job
        if: steps.trigger.outputs.run_ci != 'true'
        run: |
          echo "Skipping CI: not feat/* and Dockerfile not changed"
          exit 0

      - name: Set image tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')
          IMAGE_TAG="${BRANCH_NAME}-${SHORT_SHA}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Docker Hub login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            --username "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${IMAGE_TAG} \

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${IMAGE_TAG}

      - name: Update Helm image tag
        run: |
          yq -i \
            '.backend.container.image.tag = env(IMAGE_TAG)' \
            helm/my-app/values.yaml

      - name: Commit Helm values update
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add helm/my-app/values.yaml
          git diff --cached --quiet || git commit -m "chore: update backend image tag to ${IMAGE_TAG}"
          git push
