apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-external-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: app-secret-store
    kind: SecretStore
  target:
    name: backend-secret
  data:
    - secretKey: DB_USER
      remoteRef:
        key: prod/app-secrets
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: prod/app-secrets
        property: DB_PASSWORD
    - secretKey: DB_DATABASE
      remoteRef:
        key: prod/app-secrets
        property: DB_DATABASE